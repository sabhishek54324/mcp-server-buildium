# Run the Buildium MCP server behind a token gate.
#
#   buildium-mcp  the server (no login of its own; not published on any port)
#   gate          Caddy: only requests with "Authorization: Bearer <MCP_GATE_TOKEN>" get through
#
# Secrets are NOT in this file or in the repository. Two env files hold them (paths below):
#   BUILDIUM_ENV_FILE  BUILDIUM_CLIENT_ID=...  BUILDIUM_CLIENT_SECRET=...  (read-only key, sandbox first)
#   GATE_ENV_FILE      MCP_GATE_TOKEN=...      (at least 24 characters, for example: openssl rand -hex 24)
#
# Start:  docker compose -f deploy/docker-compose.prod.yml up -d --build
name: buildium-mcp

services:
  buildium-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ${BUILDIUM_ENV_FILE:-/etc/buildium-mcp/buildium.env}
    # BUILDIUM_BASE_URL comes from the env file above. If the file does not set it, the image default
    # (the Buildium SANDBOX, see the Dockerfile) is used. Live is https://api.buildium.com (no /v1).
    environment:
      MCP_PORT: "8000"
    expose:
      - "8000"

  gate:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ${GATE_ENV_FILE:-/etc/buildium-mcp/gate.env}
    volumes:
      - ./Caddyfile.gate:/etc/caddy/Caddyfile:ro
      # Keep the private CA across restarts, so clients that trust its root certificate keep working.
      - caddy_data:/data
    # Refuse to start with a missing or short token (an empty token would let "Bearer " through).
    command:
      - sh
      - -c
      - |
        [ "$${#MCP_GATE_TOKEN}" -ge 24 ] || { echo "MCP_GATE_TOKEN is missing or shorter than 24 characters" >&2; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      # The Docker bridge address that sandboxes reach. Set MCP_BIND to change it (check with: ip -4 addr show docker0).
      - "${MCP_BIND:-172.17.0.1}:8767:8080"
      # HTTPS (same gate, certificate from Caddy's private CA). Needs the hostname in the Caddyfile to resolve here.
      - "${MCP_BIND:-172.17.0.1}:8443:8443"
    depends_on:
      - buildium-mcp

volumes:
  caddy_data:
